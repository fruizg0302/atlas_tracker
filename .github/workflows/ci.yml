name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "29"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-test-elixir-1.20.5-otp-29-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo
      - run: mix test

  dialyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "29"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dialyzer-elixir-1.20.5-otp-29-${{ hashFiles('mix.lock') }}
      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-elixir-1.20.5-otp-29-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-elixir-1.20.5-otp-29-
      - run: mix deps.get
      - run: mix dialyzer
